name: Release

# Tags the commit it runs on v<version>, then starts 3ds.yml on the tag, which builds reg2.3dsx and reg2.cia and
# drafts the release (a tag pushed with GITHUB_TOKEN starts no workflow by itself, a workflow_dispatch does).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, x.y.z (for example 0.2.0)'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag and build
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! echo "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::The version must be x.y.z, not $VERSION"
              exit 1
          fi
          # The CIA's title version (make_cia.sh) has 6, 6 and 4 bits.
          IFS=. read -r MAJOR MINOR MICRO <<< "$VERSION"
          if [ "$MAJOR" -gt 63 ] || [ "$MINOR" -gt 63 ] || [ "$MICRO" -gt 15 ]; then
              echo "::error::A CIA cannot encode $VERSION: x and y at most 63, z at most 15"
              exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh workflow run 3ds.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
